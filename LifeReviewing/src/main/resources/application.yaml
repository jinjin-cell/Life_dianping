server:
  port: 8081
spring:
  application:
    name: lifedp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 1
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.lifedp.entity
logging:
  level:
    com.lifedp: debug
seckill:
  rate-limit:
    per-user: 5
    per-second: 10000
  stream:
    consumer-threads: 2
    max-retries: 3
    retry-delay-ms: 1000